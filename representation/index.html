function download(name,data,mime='application/json'){const b=new Blob([data],{type:mime+';charset=utf-8'}),url=URL.createObjectURL(b),el=document.createElement('a');el.href=url;el.download=name;document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
function csv(v){let s=String(v??'');if(/^[=+@-]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"';}

if(act==='csvCases'){if(!managementView(a)&&!['rep','replead','orgleader'].includes(a.role)){toast('تصدير القائمة غير متاح لهذا الدور.',true);return;}const rows=[['رقم الملف','الموضوع','الجهة','الحالة'],...V().map(c=>[c.id,c.title,c.external,E.statusLabel(c.status)])];download('representation-visible-cases.csv','\ufeff'+rows.map(r=>r.map(csv).join(',')).join('\r\n'),'text/csv');return;}
if(act==='backup'){if(!['sys','manager','dg'].includes(a.role)){toast('تصدير حالة التجربة الكاملة مخصص لإدارة النموذج؛ ليس تصدير بيانات أعمال.',true);return;}download('representation-demo-state.json',JSON.stringify(S,null,2));return;}
if(act==='restore'){if(!['sys','manager','dg'].includes(a.role)){toast('استيراد السيناريو لإدارة النموذج فقط.',true);return;}$('#import-file').click();return;}
if(act==='reset'||act==='emptyScenario'){if(!['sys','manager','dg'].includes(a.role)){toast('إعادة ضبط التجربة لإدارة النموذج فقط.',true);return;}if(!confirm('سيستبدل هذا الإجراء بيانات التجربة المحلية ونتائجها. صدّرها أولًا عند الحاجة. متابعة؟'))return;S=E.fresh(act==='emptyScenario');E.scheduler(S);persist();caseId=V()[0]?.id||'';go('REP-S01',caseId);render();toast('تمت إعادة تهيئة السيناريو.');return;}
if(act==='exportUat'){download('representation-uat-results.json',JSON.stringify({version:E.VERSION,results:S.uat},null,2));return;}
}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-act]');if(btn){e.preventDefault();let p={};try{p=JSON.parse(btn.dataset.p||'{}');handle(btn.dataset.act,p);}catch(err){toast(err.message,true);}return;}const a=e.target.closest('a[href^="#/"]');if(a&&dirty){if(!confirm('هناك مدخلات لم تحفظ. مغادرة النموذج؟'))e.preventDefault();else dirty=false;}});
document.addEventListener('input',e=>{if(e.target.closest('form[data-form]'))dirty=true;});
document.addEventListener('submit',async e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const name=f.dataset.form,d=Object.fromEntries(new FormData(f)),base=JSON.parse(f.dataset.p||'{}');let type=name,p={caseId,...base,...d};
if(name==='filters'){dirty=false;go('REP-S02',caseId,d);return;}
if(name==='study.save'){p.orgs=S.orgs.filter(o=>d['org_'+o.id]).map(o=>({id:o.id,reason:d['reason_'+o.id],quota:Number(d['quota_'+o.id])}));p.english=!!d.english;p.pii=!!d.pii;}
if(name==='case.create')p.requestedMultiplicity=!!d.requestedMultiplicity;
if(name==='candidate.save'){p.available=!!d.available;p.conflict=!!d.conflict;p.attestation=!!d.attestation;p.piiAcknowledged=!!d.piiAcknowledged;}
if(name==='nomination.respond')p.attestation=!!d.attestation;
if(name==='candidate.accept'){type='candidate.review';p.accept=true;p.checked=!!d.checked;}
if(name==='report.quality')p.checked=!!d.checked;
if(name==='minutes.save')p.conflict=!!d.conflict;
if(name==='demo.settings')p.ack=!!d.ack;
if(name==='meeting.hold'){p.attendance={};p.reasons={};for(const [k,v]of Object.entries(d)){if(k.startsWith('attendance_'))p.attendance[k.slice(11)]=v;else if(k.startsWith('reason_'))p.reasons[k.slice(7)]=v;}}
if(name==='command'){type=base.type;delete p.fields;delete p.submit;}
for(const k of ['receivedAt','meetingAt','start','end','due','clock','signatureDue'])if(p[k])p[k]=iso(p[k]);
if(name==='attachment.add'){const file=f.querySelector('input[type=file]').files[0];if(!file)return;if(file.size>2*1024*1024){toast('الحد الأقصى 2 ميجابايت.',true);return;}p.name=file.name;p.size=file.size;p.mime=file.type|| (file.name.endsWith('.txt')?'text/plain':file.name.endsWith('.json')?'application/json':'');p.data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file);});delete p.file;}
const submit=f.querySelector('button[type=submit]');submit.disabled=true;const result=run(type,p,true);submit.disabled=false;if(result===true){dirty=false;persist();closeModal();if(name==='case.create'){caseId=S.cases.at(-1).id;go('REP-S04',caseId);}else if(name==='report.create'){const r=S.reports.at(-1);go(r.type==='final'?'REP-S13':'REP-S11',caseId,{id:r.id});}else render();toast('حُفظ الإجراء في بيانات التجربة.');}else{const er=f.querySelector('.formerr');er.textContent=result.error;er.classList.remove('hidden');er.tabIndex=-1;er.focus();toast(result.error,true);}
});
document.addEventListener('change',e=>{if(e.target.id==='role'){if(dirty&&!confirm('هناك مدخلات لم تحفظ. تغيير الدور؟')){e.target.value=actorId;return;}actorId=e.target.value;const valid=V().some(c=>c.id===caseId);caseId=valid?caseId:V()[0]?.id||'';dirty=false;go(route,caseId);render();}
if(e.target.id==='case-select'){if(dirty&&!confirm('مغادرة المدخلات غير المحفوظة؟'))return;dirty=false;caseId=e.target.value;go(route,caseId);render();}
if(e.target.id==='import-file'){const file=e.target.files[0];if(!file)return;if(file.size>14*1024*1024){toast('ملف الحالة أكبر من الحد.',true);return;}file.text().then(text=>{try{const s=E.validateImport(JSON.parse(text));if(!confirm('سيستبدل الاستيراد الحالة التجريبية الحالية. متابعة؟'))return;S=s;persist();caseId=V()[0]?.id||'';go('REP-S01',caseId);render();toast('تم استيراد حالة التجربة.');}catch(err){toast('رفض الاستيراد: '+err.message,true);}});}
});
$('#global-search').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go('REP-S02',caseId,{q:e.target.value});}});
$('#menu-toggle').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));
$('#modal-close').addEventListener('click',closeModal);
$('#modal').addEventListener('cancel',()=>{dirty=false;});
window.addEventListener('hashchange',()=>{render();$('#page-title')?.focus({preventScroll:true});window.scrollTo(0,0);});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
window.RepApp={state:S,route,actorId,caseId,version:E.VERSION,render,dispatch:(actor,type,p)=>{S=E.dispatch(S,actor,type,p);persist();render();return S;},getState:()=>E.clone(S),setTestState:s=>{S=E.validateImport(s);persist();render();},setActor:id=>{actorId=id;if(!V().some(c=>c.id===caseId))caseId=V()[0]?.id||'';go(route,caseId);render();},go};
persist();render();
})();

</script></body></html>
